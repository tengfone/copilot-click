[project]
name = "copilot-click"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pillow>=13.0.0",
    "pyautogui>=0.9.54",
    "pyobjc-framework-cocoa>=12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-Vision>=12.2.2; sys_platform == 'darwin'",
]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S103", "S603"]
